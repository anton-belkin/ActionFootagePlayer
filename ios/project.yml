# The iPhone prototype's Xcode project (XcodeGen: `xcodegen generate` in ios/, or ios/build_app.sh)
name: ActionFootage
options:
  bundleIdPrefix: io.github.anton-belkin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ActionFootage:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../luts/dlogm_hlg.cube
        buildPhase: resources
      - path: ../luts/gplog_hlg.cube
        buildPhase: resources
      - path: build/shaders
        type: folder
        buildPhase: resources
    dependencies:
      - framework: build/AFPMotion.xcframework
        embed: false
      - framework: build/MPV.xcframework
        embed: false
      - sdk: AudioToolbox.framework
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreText.framework
      - sdk: IOSurface.framework
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.anton-belkin.ActionFootage
        PRODUCT_NAME: Action Footage
        INFOPLIST_FILE: App/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/afp-motion/include
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: -lresolv
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

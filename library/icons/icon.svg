<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Action Footage Library's icon: the player's (macos/icon/AppIcon.svg) scene, grey log on one side and vivid color on
       the other with its play button on the seam, as two clips over a list of files, one of them selected: the Library
       browses the footage as Finder does -->
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".3"/>
    </filter>
    <filter id="soft"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity=".35"/></filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <!-- The seam through the middle of the two clips, at the player's slope -->
    <clipPath id="log"><path d="M0 0h651L156 1024H0z"/></clipPath>
    <clipPath id="vivid"><path d="M651 0h373v1024H156z"/></clipPath>
    <clipPath id="tile"><rect width="400" height="392" rx="36"/></clipPath>
    <clipPath id="tilesArea"><rect x="0" y="0" width="1024" height="480"/></clipPath>
    <clipPath id="thumb"><rect width="152" height="76" rx="12"/></clipPath>
    <linearGradient id="skyV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5e62"/><stop offset=".55" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ffd66b"/>
    </linearGradient>
    <linearGradient id="seaV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00a6c0"/><stop offset="1" stop-color="#003a6b"/>
    </linearGradient>
    <linearGradient id="skyL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8d8c"/><stop offset="1" stop-color="#a8a6a2"/>
    </linearGradient>
    <linearGradient id="seaL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8282"/><stop offset="1" stop-color="#5f6466"/>
    </linearGradient>
    <!-- One clip's frame, 400 square: the sun on the horizon over the waves -->
    <g id="sceneV">
      <rect width="400" height="250" fill="url(#skyV)"/>
      <circle cx="200" cy="250" r="72" fill="#fff3c4"/>
      <rect y="250" width="400" height="150" fill="url(#seaV)"/>
      <path d="M-10 300q40-15 80 0t80 0 80 0 80 0 80 0 80 0M-10 350q40-15 80 0t80 0 80 0 80 0 80 0 80 0" fill="none" stroke="#5fe3f0" stroke-width="11" stroke-linecap="round"/>
    </g>
    <g id="sceneL">
      <rect width="400" height="250" fill="url(#skyL)"/>
      <circle cx="200" cy="250" r="72" fill="#b9b6b0"/>
      <rect y="250" width="400" height="150" fill="url(#seaL)"/>
      <path d="M-10 300q40-15 80 0t80 0 80 0 80 0 80 0 80 0M-10 350q40-15 80 0t80 0 80 0 80 0 80 0 80 0" fill="none" stroke="#9a9e9e" stroke-width="11" stroke-linecap="round"/>
    </g>
  </defs>
  <g filter="url(#shadow)"><rect x="100" y="100" width="824" height="824" rx="185" fill="#2a2d31"/></g>
  <g clip-path="url(#body)">
    <!-- Two clips, edge to edge at the top -->
    <g clip-path="url(#log)">
      <g transform="translate(100 88)" clip-path="url(#tile)"><use xlink:href="#sceneL"/></g>
      <g transform="translate(524 88)" clip-path="url(#tile)"><use xlink:href="#sceneL"/></g>
    </g>
    <g clip-path="url(#vivid)">
      <g transform="translate(100 88)" clip-path="url(#tile)"><use xlink:href="#sceneV"/></g>
      <g transform="translate(524 88)" clip-path="url(#tile)"><use xlink:href="#sceneV"/></g>
    </g>
    <path d="M651 0L156 1024" stroke="#fff" stroke-width="9" clip-path="url(#tilesArea)"/>
    <rect x="500" y="0" width="24" height="500" fill="#2a2d31"/>
    <rect x="0" y="480" width="1024" height="40" fill="#2a2d31"/>
    <!-- The list of files below them, the middle one selected -->
    <g transform="translate(176 516)">
      <rect width="672" height="104" rx="24" fill="#363a40"/>
      <g transform="translate(14 14)" clip-path="url(#thumb)"><g transform="translate(0 -46) scale(.4)"><use xlink:href="#sceneV"/></g></g>
      <rect x="186" y="24" width="330" height="22" rx="11" fill="#e4e5e8"/>
      <rect x="186" y="62" width="220" height="16" rx="8" fill="#80868e"/>
    </g>
    <g transform="translate(176 636)">
      <rect width="672" height="104" rx="24" fill="#0A5BC4"/>
      <g transform="translate(14 14)" clip-path="url(#thumb)"><g transform="translate(0 -46) scale(.4)"><use xlink:href="#sceneV"/></g></g>
      <rect x="186" y="24" width="380" height="22" rx="11" fill="#ffffff"/>
      <rect x="186" y="62" width="250" height="16" rx="8" fill="#b9d0f5"/>
    </g>
    <g transform="translate(176 756)">
      <rect width="672" height="104" rx="24" fill="#363a40"/>
      <g transform="translate(14 14)" clip-path="url(#thumb)"><g transform="translate(0 -46) scale(.4)"><use xlink:href="#sceneL"/></g></g>
      <rect x="186" y="24" width="290" height="22" rx="11" fill="#e4e5e8"/>
      <rect x="186" y="62" width="190" height="16" rx="8" fill="#80868e"/>
    </g>
  </g>
  <g filter="url(#soft)">
    <circle cx="512" cy="288" r="112" fill="#fff"/>
    <path d="M478 228v120c0 8 9 12 15 9l97-60c7-4 7-13 0-18l-97-60c-6-4-15 1-15 9z" fill="#1c1d22"/>
  </g>
</svg>

[package]
name = "action-footage-library"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Action Footage Library: a trip's clip previews, moments, photos and exports, made in the background"

[[bin]]
name = "ActionFootageLibrary"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
notify = "8"
# The project's catalog and its locations (catalog/, docs/library-management.md §9)
afp-catalog = { path = "../catalog" }

# Explorer's thumbnails for the cards (thumbs.rs): the version Tauri already uses
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_Com",
                                         "Win32_System_Com_StructuredStorage", "Win32_UI_Shell"] }

[profile.release]
opt-level = "s"
lto = true
strip = true

# The website: website/site/ as is, published to the Cloudflare Pages project actionfootageplayer
# (actionfootageplayer.pages.dev, actionfootageplayer.ch) on every push that changes it, to the website branch or main.
#
# Needs two repository secrets: CLOUDFLARE_ACCOUNT_ID, and CLOUDFLARE_API_TOKEN, a token with Pages Write only.
name: Website

on:
  push:
    branches: [website, main]
    paths: ['website/site/**', '.github/workflows/website.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a waiting one
concurrency:
  group: website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pages' links to the shared stylesheet and scripts get the file's content hash (styles.css?v=1a2b3c4d), so a
      # browser never pairs a new page with a copy it cached earlier: Safari showed the new language switcher unstyled
      # with the old styles.css. Only the deployed copy changes; the HTML in the repository stays as is.
      - name: Version the shared stylesheet and scripts
        working-directory: website/site
        run: |
          for f in styles.css scene.js download.js; do
            v=$(sha256sum "$f" | cut -c1-8)
            find . -name '*.html' -exec perl -pi -e "s{((?:href|src)=\"(?:\.\./)?\Q$f\E)\"}{\$1?v=$v\"}g" {} +
          done
          grep -rhoE '(href|src)="[^"]*\.(css|js)[^"]*"' --include='*.html' . | sort | uniq -c

      # Both branches publish to production: the project's production branch is main
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy website/site
          --project-name actionfootageplayer --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"

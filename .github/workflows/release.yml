# The release: built on macOS (Apple Silicon) by tools/make_release.sh, the gyroflow plugin for Linux and Windows
# by tools/make_plugin_zip.sh, the Windows app's installer by tools/make_windows_app.sh, all the plugins in one zip
# per system by tools/make_plugin_bundles.py, and the NAS Helper's Docker image by tools/nas-helper/Dockerfile. A
# pushed v* tag publishes it as a GitHub release, with the tag's message as the
# release notes:
#
#   git tag -a v0.2.0 -m "<notes>" && git push origin v0.2.0
#
# Pull requests build it as a check; the files are kept as the runs' artifacts. A pull request's build is the quick
# kind (the jobs' env below: Rust built incrementally, the zip alone); a draft runs only the quick tests, and the
# whole check once it's marked ready for review.
name: Release

# Also every push to main, so main itself is known to build and pass; a PR's newer push cancels its older run.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  macos:
    # A pull request: Rust built incrementally (only what changed is compiled again, in seconds rather than the 5 min
    # a release build of vs-gyroflow takes; the binaries a little less optimized, fine to check and try) and the zip
    # alone. FULL is false for a draft: the quick tests only. Main and releases: built in full
    env:
      CARGO_INCREMENTAL: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      AFP_PACKAGES: ${{ github.event_name == 'pull_request' && 'zip' || 'all' }}
      FULL: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    # Your own branches and main build on Anton's Mac (the self-hosted runner "anton-mac", label afp: its build folders
    # kept between runs, its Homebrew as it is); releases (tags), forks and runs by hand on GitHub's macOS, whose
    # Homebrew bottles give the app the oldest macOS it runs on
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "afp"]') || 'macos-15' }}
    steps:
      # On Anton's Mac: the build folders (target/, build/, node_modules/) kept, every other file not in git removed
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - name: Tidy (Anton's Mac)
        if: runner.environment == 'self-hosted'
        run: git clean -ffd && rm -rf dist

      - name: Rust
        if: runner.environment == 'github-hosted'
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vs-gyroflow/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vs-gyroflow/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      # Carried in the app (tools/bundle_runtime.py), which then needs no Homebrew: ffmpeg, and what mpv links (mpv
      # itself is built below). The bottles are built for the runner's macOS, and the app needs that one or later: the
      # oldest runner that Homebrew has bottles for. Updated first: the runner's Homebrew is as old as its image, and
      # doesn't update itself there
      - name: Homebrew (ffmpeg, mpv's dependencies, mpv's build tools)
        if: runner.environment == 'github-hosted'
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew update && tools/build_mpv.sh --deps-only && brew install ffmpeg
          mkdir -p build && tools/build_mpv.sh --print-deps | tee build/mpv-deps.txt

      # The app's mpv (tools/build_mpv.sh: tools/mpv.lock's commit, with libplacebo in it), built again when the lock,
      # the script, or a Homebrew library it links (or the compiler) changes: it links them by their version
      - uses: actions/cache@v4
        id: mpv
        if: runner.environment == 'github-hosted'
        with:
          path: build/mpv-afp/out
          key: mpv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/mpv.lock', 'tools/build_mpv.sh', 'tools/mpv-patches/*.patch', 'tools/libplacebo-patches/*.patch', 'build/mpv-deps.txt') }}

      # On Anton's Mac: built where it was, ninja redoing only what changed
      - name: mpv
        if: runner.environment == 'self-hosted' || steps.mpv.outputs.cache-hit != 'true'
        run: tools/build_mpv.sh --no-deps

      # Every tests/*_test.{lua,py,sh}, found by name (tools/run_tests.sh: a new test needs no list here), and
      # vs-gyroflow's tests; LuaJIT is one of mpv's dependencies. The Library and the catalog: the tests job below
      - name: Tests
        run: sh tools/run_tests.sh

      - name: Rust tests
        if: env.FULL == 'true'
        run: cd vs-gyroflow && cargo test --release

      - name: Build
        if: env.FULL == 'true'
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; else version=dev-${GITHUB_SHA::7}; fi
          MPV_BIN=build/mpv-afp/out/mpv BUNDLE_RUNTIME=$(brew --prefix) tools/make_release.sh "$version"

      # A preview gyroflow-export makes, its link read back by the player's reader
      # On Anton's Mac: the apps just built in dist/ are taken out of Launch Services, so double-clicking an MP4 keeps
      # opening the one in ~/Applications (every app bundle macOS sees is registered, and may be the one it picks).
      # Taken from Launch Services' own list, not from the folder: the packaging's temporary dist/app-dev-*/ copies
      # are registered while they exist and already gone by now, and their records would stay
      - name: Built apps unregistered (Anton's Mac)
        if: always() && runner.environment == 'self-hosted'
        run: |
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$lsregister" -dump 2>/dev/null \
            | sed -n 's/^path: *\(.*\.app\) (0x[0-9a-f]*)$/\1/p' | grep -F "$GITHUB_WORKSPACE/" | sort -u \
            | while IFS= read -r app; do "$lsregister" -u "$app" || true; echo "unregistered $app"; done

      - name: Preview test
        if: env.FULL == 'true'
        run: GYROFLOW_EXPORT=vs-gyroflow/target/release/gyroflow-export luajit tests/link_test.lua

      # For the plugins job (main and releases); a pull request's app stays in dist/ on the Mac
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error

  # The Library and the catalog, which the macos job builds but doesn't test: afp-catalog's tests (with its
  # safeguards and the many-computers random run, in release: slow otherwise), the Library's Rust tests, and its page
  # in jsdom against a mock of the app (library/ui-tests). Beside the build, so it adds no time to it

      # On Anton's Mac the build folders stay between runs and grow with every change of dependencies: one over 20 GB is
      # cleaned (the next run builds it again from scratch)
      - name: Build folders kept small (Anton's Mac)
        if: always() && runner.environment == 'self-hosted'
        run: |
          for crate in vs-gyroflow library catalog; do
            kb=$(du -sk "$crate/target" 2>/dev/null | cut -f1)
            if [ "${kb:-0}" -gt 20971520 ]; then echo "$crate/target: $((kb / 1048576)) GB, cleaned"; (cd "$crate" && cargo clean); fi
          done

  tests:
    # A pull request: Rust built incrementally (only what changed is compiled again, in seconds rather than the 5 min
    # a release build of vs-gyroflow takes; the binaries a little less optimized, fine to check and try) and the zip
    # alone. FULL is false for a draft: the quick tests only. Main and releases: built in full
    env:
      CARGO_INCREMENTAL: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      AFP_PACKAGES: ${{ github.event_name == 'pull_request' && 'zip' || 'all' }}
      FULL: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    # Your own branches and main build on Anton's Mac (the self-hosted runner "anton-mac", label afp: its build folders
    # kept between runs, its Homebrew as it is); releases (tags), forks and runs by hand on GitHub's macOS, whose
    # Homebrew bottles give the app the oldest macOS it runs on
    runs-on: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted", "afp"]') || 'macos-15' }}
    steps:
      # On Anton's Mac: the build folders (target/, build/, node_modules/) kept, every other file not in git removed
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment == 'github-hosted' }}
      - name: Tidy (Anton's Mac)
        if: runner.environment == 'self-hosted'
        run: git clean -ffd

      - name: Rust
        if: runner.environment == 'github-hosted'
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v4
        if: runner.environment == 'github-hosted'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            catalog/target
            library/target
          key: cargo-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('catalog/Cargo.lock', 'library/Cargo.lock') }}
          restore-keys: cargo-tests-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-node@v4
        if: runner.environment == 'github-hosted'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: library/ui-tests/package-lock.json

      - name: Catalog
        if: env.FULL == 'true'
        run: cd catalog && cargo test --release

      - name: Library
        if: env.FULL == 'true'
        run: cd library && cargo test

      - name: Library page
        if: env.FULL == 'true'
        run: cd library/ui-tests && npm ci && npm test

  # The gyroflow plugin alone, as mpv-gyroflow-<version>-<os>-<arch>.zip, and on Windows the app with its installer,
  # ActionFootagePlayer-<version>-windows-<arch>-setup.exe, and the Library's own, ActionFootageLibrary-<version>-
  # windows-<arch>-setup.exe, for x86_64 and arm64 (on GitHub's arm64 runner, built for it as everything there is).
  # Linux on the oldest Ubuntu runner, so the binaries run with older glibc too
  plugin:
    # Not on pull requests: their required checks are macos and tests (on Anton's Mac). Every push to main and every
    # release runs it, so a break on Windows or Linux still shows up the same day
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          - os: windows
            arch: x86_64
            runner: windows-2022
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vs-gyroflow/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vs-gyroflow/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; else version=dev-${GITHUB_SHA::7}; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bash tools/make_plugin_zip.sh "$version" ${{ matrix.target }}

      # What the Windows app carries from elsewhere (mpv, Python, ffmpeg), pinned in the script
      - uses: actions/cache@v4
        if: matrix.os == 'windows'
        with:
          path: build/windows-deps
          key: windows-deps-${{ matrix.arch }}-${{ hashFiles('tools/make_windows_app.sh') }}

      - name: Windows app
        if: matrix.os == 'windows'
        run: |
          if ! command -v ISCC >/dev/null && ! ls "/c/Program Files (x86)/Inno Setup "*/ISCC.exe >/dev/null 2>&1; then
              choco install innosetup -y --no-progress
          fi
          if ! command -v 7z >/dev/null && [ ! -x "/c/Program Files/7-Zip/7z.exe" ]; then
              choco install 7zip -y --no-progress
          fi
          bash tools/make_windows_app.sh "$VERSION" ${{ matrix.target }}
          test -f "dist/ActionFootagePlayer-$VERSION-windows-${{ matrix.arch }}-setup.exe"
          test -f "dist/ActionFootageLibrary-$VERSION-windows-${{ matrix.arch }}-setup.exe"
          ls -l dist/*-setup.exe

      # The installer installs, the mpv in it plays, and the gyroflow plugin's binaries run (their DLLs found), with the
      # PATH ActionFootagePlayer.exe gives them (no GPU here: the stabilization itself isn't run)
      - name: Windows app smoke test
        if: matrix.os == 'windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Each with a time limit: a GUI program that waits (mpv idling, a dialog) would hold the job for hours
          function Run([string] $file, [string[]] $arguments, [string] $log) {
              $p = Start-Process -PassThru -FilePath $file -ArgumentList $arguments
              $null = $p.Handle  # without it, ExitCode stays empty
              $done = $p.WaitForExit(180000)
              # To the log, not the function's output (its exit code)
              if ($log -and (Test-Path $log)) { Get-Content $log -Tail 40 | Write-Host }
              if (-not $done) { $p.Kill($true); throw "$file didn't finish in 3 minutes" }
              return $p.ExitCode
          }
          $setup = "dist\ActionFootagePlayer-$env:VERSION-windows-${{ matrix.arch }}-setup.exe"
          $code = Run $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=', "/LOG=$PWD\install.log") "$PWD\install.log"
          if ($code -ne 0) { throw "the installer failed: $code" }
          $app = "$env:LOCALAPPDATA\Programs\ActionFootagePlayer"
          foreach ($f in 'ActionFootagePlayer.exe', 'mpv\mpv.exe', 'vulkan\vulkan-1.dll', 'python\python.exe', 'plugins\gyroflow\gyroflow-gpu-table.exe', 'plugins\gyroflow\ffmpeg.exe', 'plugins\footage-menu\main.lua', 'plugins\highlights\markers.lua', 'plugins\workspace\workspace.lua', 'plugins\workspace\projectfile.lua',
                     'app.conf', 'plugins\dlogm\video_color.lua', 'plugins\dlogm\luts\dlog_hlg.cube', 'plugins\dlogm\luts\gplog_hlg.cube') {
              if (-not (Test-Path "$app\$f")) { throw "not installed: $f" }
          }
          # The player's installer alone has no Library; the Library's own installer puts it beside the player
          if (Test-Path "$app\ActionFootageLibrary.exe") { throw "the player's installer installed the Library" }
          $library = "dist\ActionFootageLibrary-$env:VERSION-windows-${{ matrix.arch }}-setup.exe"
          $code = Run $library @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$PWD\library.log") "$PWD\library.log"
          if ($code -ne 0) { throw "the Library's installer failed: $code" }
          if (-not (Test-Path "$app\ActionFootageLibrary.exe")) { throw "not installed: ActionFootageLibrary.exe" }
          Write-Host "Sample clip: $(Test-Path "$app\sample\*.mp4")"
          # As ActionFootagePlayer.exe sets it: the runner has no GPU driver, so no Vulkan loader but the app's
          Write-Host "System Vulkan loader: $(Test-Path "$env:SystemRoot\System32\vulkan-1.dll")"
          $env:PATH = "$app\python;$env:PATH;$app\vulkan"
          # Started without a console, mpv would be the pseudo-GUI, which waits idle after a file that failed
          $code = Run "$app\mpv\mpv.exe" @('--no-config', '--player-operation-mode=cplayer', '--idle=no', '--force-window=no',
              '--vo=null', '--ao=null', '--frames=10', '--msg-level=all=v', "--log-file=$PWD\mpv.log",
              'av://lavfi:testsrc=duration=2:size=320x240:rate=10') "$PWD\mpv.log"
          if ($code -ne 0) { throw "mpv didn't play: $code" }
          # The plugin's binaries start (a missing DLL is 0xC0000135) and answer: the probe on a file that isn't there
          $probe = & "$app\plugins\gyroflow\gyroflow-probe.exe" "$PWD\none.mp4"
          if ($LASTEXITCODE -ne 0 -or -not ($probe -match '"reason"')) { throw "gyroflow-probe didn't run: $LASTEXITCODE $probe" }
          # The setup, with the app's Python: DJI's LUT (DJI's server, so a warning only)
          $code = Run "$app\python\python.exe" @('-I', "$app\tools\setup.py", 'lut') $null
          if ($code -ne 0) { Write-Output "::warning::setup.py couldn't fetch DJI's LUT" }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # All the plugins in one zip per system, mpv-plugins-<version>-<os>-<arch>.zip, from the zips the builds made
  # The NAS Helper (tools/nas-helper): collaboration, the stream and the links for Jellyfin as one Docker image for an
  # x86-64 NAS, saved as ActionFootageNASHelper-<version>-linux-x86_64.tar.gz (`docker load -i` it) with its example
  # compose.yaml. Its own artifact: the plugins job doesn't need it
  nas-helper:
    # Not on pull requests: their required checks are macos and tests (on Anton's Mac). Every push to main and every
    # release runs it, so a break on Windows or Linux still shows up the same day
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; else version=dev-${GITHUB_SHA::7}; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The layers kept between runs (libplacebo and mpv, the Rust dependencies take most of the time)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/nas-helper/Dockerfile
          build-args: VERSION=${{ env.VERSION }}
          tags: actionfootage-nas-helper:${{ env.VERSION }},actionfootage-nas-helper:latest
          load: true
          cache-from: type=gha,scope=nas-helper
          cache-to: type=gha,scope=nas-helper,mode=max

      # It starts and says what it would run, with a project and a share as a NAS would bind them in
      - name: Smoke test
        run: |
          mkdir -p t/Trip t/video t/data t/config
          echo '{"locations":[{"path":"//NAS/video/DCIM"}]}' > t/Trip/Project.afproject
          docker run --rm actionfootage-nas-helper:latest --help | head -5
          docker run --rm -v "$PWD/t/Trip:/projects/Trip" -v "$PWD/t/Trip:/library/Trip:ro" -v "$PWD/t/video:/shares/video:ro" \
            -v "$PWD/t/data:/data" -v "$PWD/t/config:/config" actionfootage-nas-helper:latest --check
          docker run --rm --entrypoint mpv actionfootage-nas-helper:latest --version | head -1

      - name: Save
        run: |
          mkdir -p dist
          name=ActionFootageNASHelper-$VERSION-linux-x86_64
          docker save actionfootage-nas-helper:$VERSION actionfootage-nas-helper:latest | gzip -6 > dist/$name.tar.gz
          sed "s/\${AFP_VERSION:-latest}/$VERSION/" tools/nas-helper/compose.yaml > dist/ActionFootageNASHelper-$VERSION-compose.yaml
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: nas-helper
          path: dist/
          if-no-files-found: error
          compression-level: 0

  plugins:
    # Not on pull requests: their required checks are macos and tests (on Anton's Mac). Every push to main and every
    # release runs it, so a break on Windows or Linux still shows up the same day
    if: github.event_name != 'pull_request'
    needs: [macos, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true

      - name: Bundle
        run: |
          python3 -I tools/make_plugin_bundles.py dist
          mkdir bundles && mv dist/mpv-plugins-*.zip bundles/

      - uses: actions/upload-artifact@v4
        with:
          name: release-plugins
          path: bundles/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, tests, plugin, plugins, nas-helper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: nas-helper
          path: dist/

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One SHA256SUMS for all of it (the macOS build's has only its own files)
          (cd dist && sha256sum *.dmg *.zip *.tar.gz *.exe *.yaml > SHA256SUMS && cat SHA256SUMS)
          # actions/checkout leaves the tag as a lightweight one on the commit, and --notes-from-tag would then take
          # the commit's message: the tag itself, with its message
          git fetch --depth=1 --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag ] || { echo "$GITHUB_REF_NAME isn't an annotated tag" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.tar.gz dist/*.zip dist/*.exe dist/*.yaml dist/SHA256SUMS \
            --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-from-tag

  # The website deployed again, from the website branch, so its download page has this release (website.yml writes
  # latest.json from it)
  website:
    needs: publish
    uses: anton-belkin/ActionFootagePlayer/.github/workflows/website.yml@website
    with:
      ref: website
    secrets: inherit

# The release: built on macOS (Apple Silicon) by tools/make_release.sh, the gyroflow plugin for Linux and Windows
# by tools/make_plugin_zip.sh, the Windows app's installer by tools/make_windows_app.sh, and all the plugins in one zip
# per system by tools/make_plugin_bundles.py. A pushed v* tag publishes it as a GitHub release, with the tag's message as the
# release notes:
#
#   git tag -a v0.2.0 -m "<notes>" && git push origin v0.2.0
#
# Pull requests build it as a check; the files are kept as the runs' artifacts.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vs-gyroflow/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vs-gyroflow/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      # Carried in the app (tools/bundle_runtime.py), which then needs no Homebrew: ffmpeg, and what mpv links (mpv
      # itself is built below). The bottles are built for the runner's macOS, and the app needs that one or later: the
      # oldest runner that Homebrew has bottles for. Updated first: the runner's Homebrew is as old as its image, and
      # doesn't update itself there
      - name: Homebrew (ffmpeg, mpv's dependencies, mpv's build tools)
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew update && tools/build_mpv.sh --deps-only && brew install ffmpeg
          mkdir -p build && tools/build_mpv.sh --print-deps | tee build/mpv-deps.txt

      # The app's mpv (tools/build_mpv.sh: tools/mpv.lock's commit, with libplacebo in it), built again when the lock,
      # the script, or a Homebrew library it links (or the compiler) changes: it links them by their version
      - uses: actions/cache@v4
        id: mpv
        with:
          path: build/mpv-afp/out
          key: mpv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/mpv.lock', 'tools/build_mpv.sh', 'tools/mpv-patches/*.patch', 'build/mpv-deps.txt') }}

      - name: mpv
        if: steps.mpv.outputs.cache-hit != 'true'
        run: tools/build_mpv.sh --no-deps

      # The workspace plugin's lookup and its Rust twin, over the same cases (tests/workspace_cases.txt); the link
      # reader over files made here and by ffmpeg, and the MP4 keys' writer; the lossless cut, of a file ffmpeg makes;
      # the 360 view's geometry and gestures, and the spherical metadata; LuaJIT is one of mpv's dependencies
      - name: Tests
        run: |
          luajit tests/workspace_test.lua
          luajit tests/link_test.lua
          luajit tests/moments_test.lua
          luajit tests/cut_test.lua
          luajit tests/sidecar_test.lua
          luajit tests/view360_test.lua
          luajit tests/transform_test.lua
          luajit tests/projectfile_test.lua
          luajit tests/longpath_test.lua
          luajit tests/timeline_test.lua
          (cd vs-gyroflow && cargo test --release --lib --bin gyroflow-export -- workspace mp4meta dates preview_sizes flipbook zones cut:: probe:: rig:: heading:: sphere360::tests::the_spans)

      - name: Build
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; else version=dev-${GITHUB_SHA::7}; fi
          MPV_BIN=build/mpv-afp/out/mpv BUNDLE_RUNTIME=$(brew --prefix) tools/make_release.sh "$version"

      # A preview gyroflow-export makes, its link read back by the player's reader
      - name: Preview test
        run: GYROFLOW_EXPORT=vs-gyroflow/target/release/gyroflow-export luajit tests/link_test.lua

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error

  # The gyroflow plugin alone, as mpv-gyroflow-<version>-<os>-<arch>.zip, and on Windows the app with its installer,
  # ActionFootagePlayer-<version>-windows-<arch>-setup.exe, for x86_64 and arm64 (on GitHub's arm64 runner, built
  # for it as everything there is). Linux on the oldest Ubuntu runner, so the binaries run with older glibc too
  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          - os: windows
            arch: x86_64
            runner: windows-2022
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vs-gyroflow/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vs-gyroflow/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Build
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then version=${GITHUB_REF_NAME#v}; else version=dev-${GITHUB_SHA::7}; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bash tools/make_plugin_zip.sh "$version" ${{ matrix.target }}

      # What the Windows app carries from elsewhere (mpv, Python, VapourSynth, ffmpeg), pinned in the script; on arm64
      # with the VapourSynth built from its source
      - uses: actions/cache@v4
        if: matrix.os == 'windows'
        with:
          path: build/windows-deps
          key: windows-deps-${{ matrix.arch }}-${{ hashFiles('tools/make_windows_app.sh') }}

      - name: Windows app
        if: matrix.os == 'windows'
        run: |
          if ! command -v ISCC >/dev/null && ! ls "/c/Program Files (x86)/Inno Setup "*/ISCC.exe >/dev/null 2>&1; then
              choco install innosetup -y --no-progress
          fi
          if ! command -v 7z >/dev/null && [ ! -x "/c/Program Files/7-Zip/7z.exe" ]; then
              choco install 7zip -y --no-progress
          fi
          bash tools/make_windows_app.sh "$VERSION" ${{ matrix.target }}
          test -f "dist/ActionFootagePlayer-$VERSION-windows-${{ matrix.arch }}-setup.exe"

      # The installer installs, and the mpv in it plays through VapourSynth, with the Python in it and the gyroflow
      # plugin loaded, the way ActionFootagePlayer.exe starts it (no GPU here: the stabilization itself isn't run)
      - name: Windows app smoke test
        if: matrix.os == 'windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Each with a time limit: a GUI program that waits (mpv idling, a dialog) would hold the job for hours
          function Run([string] $file, [string[]] $arguments, [string] $log) {
              $p = Start-Process -PassThru -FilePath $file -ArgumentList $arguments
              $null = $p.Handle  # without it, ExitCode stays empty
              $done = $p.WaitForExit(180000)
              # To the log, not the function's output (its exit code)
              if ($log -and (Test-Path $log)) { Get-Content $log -Tail 40 | Write-Host }
              if (-not $done) { $p.Kill($true); throw "$file didn't finish in 3 minutes" }
              return $p.ExitCode
          }
          $setup = "dist\ActionFootagePlayer-$env:VERSION-windows-${{ matrix.arch }}-setup.exe"
          $code = Run $setup @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=', "/LOG=$PWD\install.log") "$PWD\install.log"
          if ($code -ne 0) { throw "the installer failed: $code" }
          $app = "$env:LOCALAPPDATA\Programs\ActionFootagePlayer"
          foreach ($f in 'ActionFootagePlayer.exe', 'mpv\mpv.exe', 'vulkan\vulkan-1.dll', 'python\python.exe', 'plugins\gyroflow\vs_gyroflow.dll', 'plugins\gyroflow\ffmpeg.exe', 'plugins\footage-menu\main.lua', 'plugins\highlights\markers.lua', 'plugins\workspace\workspace.lua', 'plugins\workspace\projectfile.lua', 'ActionFootageLibrary.exe',
                     'app.conf', 'plugins\dlogm\video_color.lua', 'plugins\dlogm\luts\dlog_hlg.cube', 'plugins\dlogm\luts\gplog_hlg.cube') {
              if (-not (Test-Path "$app\$f")) { throw "not installed: $f" }
          }
          $plugin = "$app\plugins\gyroflow\vs_gyroflow.dll"
          Set-Content -Path vs-test.vpy -Value @(
              'import vapoursynth as vs',
              'core = vs.core',
              "core.std.LoadPlugin(r'$plugin')",
              'assert hasattr(core, "gyroflow")',
              'video_in.std.Invert().set_output()')
          $env:VSSCRIPT_PATH = "$app\python\Lib\site-packages\vapoursynth\vsscript.dll"
          # As ActionFootagePlayer.exe sets it: the runner has no GPU driver, so no Vulkan loader but the app's
          Write-Host "System Vulkan loader: $(Test-Path "$env:SystemRoot\System32\vulkan-1.dll")"
          $env:PATH = "$app\python;$env:PATH;$app\vulkan"
          # Started without a console, mpv would be the pseudo-GUI, which waits idle after a file that failed
          $code = Run "$app\mpv\mpv.exe" @('--no-config', '--player-operation-mode=cplayer', '--idle=no', '--force-window=no',
              '--vo=null', '--ao=null', '--frames=10', '--msg-level=all=v', "--log-file=$PWD\mpv-vs.log",
              "--vf=vapoursynth=file=[$PWD\vs-test.vpy]", 'av://lavfi:testsrc=duration=2:size=320x240:rate=10') "$PWD\mpv-vs.log"
          if ($code -ne 0) { throw "mpv didn't play through VapourSynth: $code" }
          # The setup, with the app's Python: DJI's LUT (DJI's server, so a warning only)
          $code = Run "$app\python\python.exe" @('-I', "$app\tools\setup.py", 'lut') $null
          if ($code -ne 0) { Write-Output "::warning::setup.py couldn't fetch DJI's LUT" }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # All the plugins in one zip per system, mpv-plugins-<version>-<os>-<arch>.zip, from the zips the builds made
  plugins:
    needs: [macos, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true

      - name: Bundle
        run: |
          python3 -I tools/make_plugin_bundles.py dist
          mkdir bundles && mv dist/mpv-plugins-*.zip bundles/

      - uses: actions/upload-artifact@v4
        with:
          name: release-plugins
          path: bundles/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, plugin, plugins]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One SHA256SUMS for all of it (the macOS build's has only its own files)
          (cd dist && sha256sum *.dmg *.zip *.tar.gz *.exe > SHA256SUMS && cat SHA256SUMS)
          # actions/checkout leaves the tag as a lightweight one on the commit, and --notes-from-tag would then take
          # the commit's message: the tag itself, with its message
          git fetch --depth=1 --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag ] || { echo "$GITHUB_REF_NAME isn't an annotated tag" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.tar.gz dist/*.zip dist/*.exe dist/SHA256SUMS \
            --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-from-tag

  # The website deployed again, from the website branch, so its download page has this release (website.yml writes
  # latest.json from it)
  website:
    needs: publish
    uses: anton-belkin/ActionFootagePlayer/.github/workflows/website.yml@website
    with:
      ref: website
    secrets: inherit

[package]
name = "vs-gyroflow"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Gyroflow stabilization as a VapourSynth filter, for realtime playback in mpv"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Gyroflow master, which has the Static zoom modes (gyroflow/gyroflow#1264) the plugin renders. The plugin itself
# uses nothing beyond what upstream exports.
# No OpenCL: with frames in system memory, wgpu (Metal) is 40-60% faster on Apple Silicon. No cache-gyro-metadata: it
# would hand back a clip's first seconds of motion data when it's parsed again with more (motion.rs keeps what's read)
# From the fork until upstream has it: 3d9f610 with MemoryHints::MemoryUsage on integrated GPUs (branch
# integrated-gpu-memory-usage-3d9f610), without which 3 workers on an Intel iGPU took 9 GB of RAM and the next clip ran
# the GPU out of memory. Back to gyroflow/gyroflow once the pull request with it is merged
gyroflow-core = { git = "https://github.com/anton-belkin/gyroflow.git", rev = "1e7f531", default-features = false, features = ["bundle-lens-profiles"] }
# The metadata track's sample table, read ahead (src/prefetch.rs); the same mp4parse as telemetry-parser
mp4parse = { package = "mp4parse-patched", version = "0.17.1", features = ["unstable-api"] }
url = "2"
vapoursynth4-sys = "0.4.1"
log = "0.4"
simplelog = "0.12"
parking_lot = "0.12"
serde_json = "1"
# gyroflow-export's LUT on the GPU; the same wgpu as gyroflow-core
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
# gyroflow-export: stopping cleanly on SIGTERM, background priority
libc = "0.2"
# The trail on a sphere (src/sphere.rs); the same nalgebra as gyroflow-core
nalgebra = "0.34"

[profile.release]
debug = 1

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1
debug = 0
strip = true

[package]
name = "vs-gyroflow"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Gyroflow stabilization as a VapourSynth filter, for realtime playback in mpv"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Gyroflow master plus the Static zoom PR (gyroflow/gyroflow#1264), which only adds project settings: the plugin
# itself uses nothing beyond upstream, and builds against gyroflow/gyroflow master as well.
# No OpenCL: with frames in system memory, wgpu (Metal) is 40-60% faster on Apple Silicon
gyroflow-core = { git = "https://github.com/anton-belkin/gyroflow.git", rev = "57941ac", default-features = false, features = ["bundle-lens-profiles", "cache-gyro-metadata"] }
url = "2"
vapoursynth4-sys = "0.4.1"
log = "0.4"
simplelog = "0.12"
parking_lot = "0.12"
serde_json = "1"

[profile.release]
debug = 1

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1
debug = 0
strip = true

# Recommended settings for watching camera footage; install.sh puts this in place only when there's no mpv.conf
# yet (or the one an earlier version installed). The plugins (scripts/dlogm, scripts/gyroflow) don't need it.

input-ipc-server=/tmp/mpvsocket

# Default: native playback, hardware decode preserved for 4K60 realtime
hwdec=auto

# Window opens at native pixel size, but capped at 85% of each screen axis
# for sources that would otherwise overflow (e.g. 4K on a 14"/16" MacBook).
# Aspect is preserved. Small videos stay at native size.
autofit-larger=85%x85%

# Opening any file builds a playlist of same-media-type siblings from its
# folder, in directory sort order (alphabetical on APFS).
autocreate-playlist=filter

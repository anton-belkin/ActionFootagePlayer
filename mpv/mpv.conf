input-ipc-server=/tmp/mpvsocket

# Default: native playback, hardware decode preserved for 4K60 realtime
hwdec=auto

# Window opens at native pixel size, but capped at 85% of each screen axis
# for sources that would otherwise overflow (e.g. 4K on a 14"/16" MacBook).
# Aspect is preserved. Small videos stay at native size.
autofit-larger=85%x85%

# Opening any file builds a playlist of same-media-type siblings from its
# folder, in directory sort order (alphabetical on APFS).
autocreate-playlist=filter

# Profiles for DJI D-Log M sources. Both are GPU-shader based. The auto-script
# in scripts/dlog_auto.lua applies the right one on file load based on which
# host is running the libmpv instance (IINA vs mpv standalone).
#
#   dji_sdr  — HOOK MAIN shader, D-Log M -> Rec.709 SDR. Used in IINA, where the
#              libmpv-OpenGL render context cannot engage macOS HDR mode.
#   dji_hdr  — HOOK OUTPUT shader, D-Log M -> Rec.2100 HLG 1000-nit. Used in
#              mpv standalone (vo=gpu-next, Vulkan). The shader replaces mpv's
#              final output entirely, so the host color pipeline doesn't get a
#              chance to mangle the HLG-encoded shader output. macOS HDR mode
#              engages via target-trc=hlg + target-colorspace-hint=yes.
#              SOURCE FILES ARE NOT MODIFIED.
#
# profile-restore lets dlog_auto.lua undo a profile when the playlist moves on to a file that isn't D-Log M.

[dji_sdr]
profile-desc=DJI D-Log M -> Rec.709 SDR (GPU shader, IINA + mpv compatible)
profile-restore=copy
glsl-shaders=~~/shaders/dlogm_lut3d.glsl
target-trc=auto
target-prim=auto
target-peak=auto
target-colorspace-hint=auto

[dji_hdr]
profile-desc=DJI D-Log M -> Rec.2100 HLG 1000-nit (GPU shader, requires HLG retag)
profile-restore=copy
glsl-shaders=~~/shaders/dlogm_hlg.glsl
target-trc=hlg
target-prim=bt.2020
target-peak=1000
target-colorspace-hint=yes

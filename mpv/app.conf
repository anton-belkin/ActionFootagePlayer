# ActionFootagePlayer's own mpv settings (the Mac and Windows apps carry this file; their mpv has a config folder of
# its own, and reads none of the mpv.conf, input.conf or scripts of an mpv you may also have)

# Hardware decoding, which 4K60 needs to play in real time
hwdec=auto

# The window at the video's own size, but at most 85% of the screen each way (4K on a laptop)
autofit-larger=85%x85%

# Opening a video makes a playlist of the videos beside it, in the folder's order
autocreate-playlist=filter
